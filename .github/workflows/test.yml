name: golang
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      ## Setup GO
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: run tests
        run: make test

      - name: ensure test coverage
        run: make coverage

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install NPM dependencies
        run: make install-ui

      - name: Run UI tests
        run: make ui-test

      - name: Build frontend
        run: make package-ui

      # Same check GoReleaser runs before a release, so drift fails here instead of at tag time.
      - name: Ensure the build left the git tree clean
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

